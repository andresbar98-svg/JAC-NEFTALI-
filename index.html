<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ganado – Porfidio Mateus</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--tx:#25301f;--mu:#6b7560;--ac:#3f6b2f;--bd:#ddd8c8;--rd:#a33;--box-sizing:border-box;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f17;--card:#262b21;--tx:#eef0e8;--mu:#a2ab96;--ac:#8cc46f;--bd:#3a4033;--rd:#e87}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:0 12px 40px}
h1{font-size:20px;margin:14px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
nav button{flex:1;white-space:nowrap;padding:10px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{font-size:12px;color:var(--mu)}.v{font-size:18px;font-weight:700}
.pos{color:var(--ac)}.neg{color:var(--rd)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.go{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--tx)}
.x{background:none;border:0;color:var(--rd);font-size:13px;padding:2px 0}
.hide{display:none}h2{font-size:16px;margin:14px 0 8px}
body.home{background:linear-gradient(165deg,var(--bg),color-mix(in srgb,var(--ac) 22%,var(--bg)))}
.top{display:flex;align-items:center;gap:12px;margin:12px 0}.top>div{flex:1;min-width:0}.top b{display:block;font-size:17px}
.ico{width:46px;height:46px;border-radius:14px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px;animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.chip{white-space:nowrap;padding:8px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:13px}
.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px;flex:none}
.eb{font-size:12px;letter-spacing:.12em;color:var(--ac);text-transform:uppercase;margin:18px 0 4px}
.big{font-size:30px;font-weight:800;line-height:1.1;margin:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px}.st .k{min-height:30px}.st b{display:block;font-size:16px;margin:4px 0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mi{display:flex;flex-direction:row;align-items:center;gap:8px;text-align:left;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:18px;padding:10px;min-height:84px;font-size:14px}
.mi .ico{width:38px;height:38px;font-size:19px;flex:none}.mi>span:last-child{min-width:0}.mi b{font-size:15px;line-height:1.15}.mi span.k{display:block;font-size:12px;line-height:1.2;margin-top:2px}
#cmp{position:fixed;inset:0;z-index:9;overflow:auto;background:var(--bg);color:var(--tx);padding:calc(12px + env(safe-area-inset-top,0px)) 12px 40px}
.sec{background:none;border:1px solid var(--bd);color:var(--tx);width:100%;margin-top:8px;padding:12px;border-radius:10px;font-size:15px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.f2>div{min-width:0}
.sig{display:flex;gap:16px;margin-top:36px}.sig div{flex:1;border-top:1px solid var(--tx);padding-top:4px;font-size:12px;text-align:center}
@media print{body>*:not(#cmp){display:none!important}#cmp{position:static;background:#fff!important;color:#000!important}#cmp *{color:#000!important;background:none!important;border-color:#999!important}.np{display:none!important}}
</style></head><body>
<div id="hd"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const hoy=()=>new Date().toISOString().slice(0,10);
const fm=n=>"$"+(Math.trunc(n/1000)*1000).toLocaleString("es-CO");
const mny=e=>{const d=e.value.replace(/\D/g,"");e.value=d?(+d).toLocaleString("es-CO"):""};
const N=q=>+(($(q)||{}).value||"").replace(/\D/g,"");
const fx=n=>"$"+Math.round(n).toLocaleString("es-CO");
const MS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const fd=d=>{const[a,m,s]=d.split("-");return +s+" "+MS[m-1]+" "+a};
const uid=()=>Math.random().toString(36).slice(2,9);
const seed=()=>({
 animales:[
  {id:"a1",nombre:"Vaca",tipo:"Vaca",origen:"Traída",fecha:"2024-01-01",valor:2500000,madre:""},
  {id:"a2",nombre:"Ternera",tipo:"Ternera",origen:"Traída",fecha:"2024-01-01",valor:1500000,madre:""},
  {id:"a3",nombre:"Cría de la vaca",tipo:"Cría",origen:"Cría",fecha:"2026-11-12",valor:1500000,madre:"a1",compra:true}],
 valor:[{id:"v1",animal:"a2",fecha:"2026-11-12",valor:2500000,nota:"Valorización de la ternera"}],
 ventas:[{id:"s1",animal:"a1",fecha:"2026-11-12",kilos:435,precio:7750,comprador:""}],pagos:[{id:"p1",fecha:"2026-11-12",valor:500000,concepto:"Ganancia de la ternera (roja)"}]});
let D;
try{D=JSON.parse(localStorage.getItem("ganado-pm")||"null")}catch(e){}
if(!D)D=seed();
D.animales.forEach(a=>{if(a.id=="a3"&&a.compra===undefined)a.compra=true});
if(!D.pagos)D.pagos=seed().pagos;
const save=()=>{try{localStorage.setItem("ganado-pm",JSON.stringify(D))}catch(e){}if(window.fbPush)window.fbPush()};
const SYN=()=>{
 if(!navigator.onLine)return{c:"#e53935",s:"Sin internet",t:"Sin internet: la app funciona con los datos del teléfono y se sincroniza al volver la conexión."};
 const v=window.SYNC;
 if(v=="ok")return{c:"#2ecc40",s:"Conectado",t:"En línea y conectado a Firebase: los datos se sincronizan."};
 if(v=="err")return{c:"#e53935",s:"Sin Firebase",t:"Hay internet pero Firebase no responde. Revisa que Firestore esté creado y las reglas permitan leer y escribir."};
 if(v=="cache")return{c:"#ff9800",s:"Solo local",t:"No se logra contactar el servidor de Firebase. Se muestran los datos guardados en el teléfono."};
 return{c:"#f4c20d",s:"Conectando",t:"Conectando con Firebase…"};
};
const chipS=()=>{const y=SYN();return `<span class="chip" onclick="alert(SYN().t)"><i class="dot" style="background:${y.c};color:${y.c}"></i> ${y.s}</span>`};
window.APP={chip:()=>document.querySelectorAll(".chip").forEach(e=>{const y=SYN();e.innerHTML=`<i class="dot" style="background:${y.c};color:${y.c}"></i> ${y.s}`}),get:()=>D,set:v=>{D=v;try{localStorage.setItem("ganado-pm",JSON.stringify(D))}catch(e){}},render:()=>render()};
let tab="inicio",ed=null,modo=null,dest="efectivo";
const DL={efectivo:"💵 Saldo en efectivo",compra:"🛒 Para nueva compra"};
function setDest(d){dest=d;$("#d1").className=d=="efectivo"?"go":"sec";$("#d2").className=d=="compra"?"go":"sec"}
function fill(){
 const set=(i,v)=>{const x=$("#"+i);if(x)x.value=(i=="vl"||i=="p")&&v!==""&&v!=null?(+v).toLocaleString("es-CO"):v};
 const an=id=>{const s=$("#an");if(s&&![...s.options].some(o=>o.value==id))s.add(new Option(nom(id),id));set("an",id)};
 if(!ed)return;
 if(tab=="animales"){const a=D.animales.find(x=>x.id==ed);if(!a)return;set("n",a.nombre);set("t",a.tipo);set("m",a.madre);set("f",a.fecha);set("vl",a.valor);set("cp",a.compra?"1":"")}
 if(tab=="valor"){const v=D.valor.find(x=>x.id==ed);if(!v)return;an(v.animal);set("f",v.fecha);set("vl",v.valor);set("nt",v.nota||"")}
 if(tab=="ventas"){const s=D.ventas.find(x=>x.id==ed);if(!s)return;an(s.animal);set("f",s.fecha);set("k",s.kilos);set("p",s.precio);set("c",s.comprador||"");tt()}
 if(tab=="pagos"){const p=D.pagos.find(x=>x.id==ed);if(!p)return;set("f",p.fecha);set("cn",p.concepto);set("vl",p.valor)}
 window.scrollTo(0,0);
}
const btn=(f)=>`<button class="go" onclick="${f}()">${ed?"Guardar cambios":"Guardar"}</button>${ed?'<button class="x" style="width:100%;margin-top:8px" onclick="ed=null;render()">Cancelar edición</button>':""}`;
const vendido=id=>D.ventas.find(s=>s.animal==id);
const base=a=>a.origen=="Cría"?0:a.valor;
function liq(a){const s=vendido(a.id);const fin=s?s.kilos*s.precio:actual(a);const g=fin-base(a);const p=a.compra?(a.valor-base(a))/2:g/2;return{fin,g,p,estado:s?"Vendido":"Activo"}}
function liqHtml(){let tp=0;
 const rows=D.animales.map(a=>{const x=liq(a);tp+=x.p;
  return `<div class="card"><div class="row"><b>${a.nombre}</b><span class="tag">${x.estado}</span></div><div class="k">${fm(base(a))} → ${fm(x.fin)} · Aumento ${fm(x.g)}</div><div class="row" style="margin-top:6px"><div><div class="k">Don Porfidio</div><b>${fm(x.p)}</b></div><div style="text-align:right"><div class="k">Luis Barrantes</div><b>${fm(x.g-x.p)}</b></div></div>${a.compra?`<div class="k" style="margin-top:6px">Luis le compró a don Porfidio su mitad por ${fm(x.p)}</div>`:""}</div>`}).join("");
 const vs=D.animales.filter(a=>vendido(a.id));
 const venta=vs.reduce((s,a)=>s+liq(a).fin,0),pv=vs.reduce((s,a)=>s+liq(a).p,0),pc=D.animales.filter(a=>a.compra&&!vendido(a.id)).reduce((s,a)=>s+liq(a).p,0);
 const va=D.animales.filter(a=>!a.compra&&!vendido(a.id)&&liq(a).p>0),pt=va.reduce((s,a)=>s+liq(a).p,0);
 const luis=vs.length?`<div class="card" style="border-color:var(--ac)"><b>Lo que le queda a don Luis (${vs.map(a=>a.nombre).join(", ")} vendida)</b><div class="row" style="margin-top:8px"><span>Valor de la venta</span><b>${fm(venta)}</b></div><div class="row"><span>− Mitad de don Porfidio en el aumento</span><b>${fm(pv)}</b></div>${pc?`<div class="row"><span>− Mitad de la cría que Luis compró</span><b>${fm(pc)}</b></div>`:""}${va.map(a=>`<div class="row"><span>− Mitad de don Porfidio en la valorización de ${a.nombre}</span><b>${fm(liq(a).p)}</b></div>`).join("")}<div class="row" style="margin-top:8px"><span>Le queda a Luis Barrantes</span><b class="pos" style="font-size:18px">${fm(venta-pv-pc-pt)}</b></div><div class="k" style="margin-top:6px">Incluye el capital de Luis ya recuperado</div><button class="sec" onclick="compLuis()">🧾 Comprobante de don Luis</button></div>`:"";
 return `<div class="card" style="border-color:var(--ac)"><div class="k">Le corresponde a don Porfidio Mateus</div><div class="v pos">${fm(tp)}</div><div class="k">Mitad de los aumentos. Dueño del ganado: Luis Barrantes</div></div>${luis}<h2>Liquidación por animal</h2>${rows}`}
const nom=id=>(D.animales.find(a=>a.id==id)||{nombre:"?"}).nombre;
function actual(a){const l=D.valor.filter(v=>v.animal==a.id).sort((x,y)=>x.fecha<y.fecha?1:-1)[0];return l?l.valor:a.valor}
const MENU=[["resumen","📊","Resumen","Cuentas y liquidación"],["animales","🐄","Animales y crías","Registro del hato"],["valor","📈","Valorización","Cambios de valor"],["ventas","⚖️","Ventas","Kilos y precio"],["pagos","💵","Pagos","Pagos a don Luis"],["comps","🧾","Comprobantes","Para don Porfidio y don Luis"]];
const go=k=>{tab=k;ed=null;modo=null;render();window.scrollTo(0,0)};
function render(){
 document.body.classList.toggle("home",tab=="inicio");
 const m=MENU.find(x=>x[0]==tab);
 $("#hd").innerHTML=tab=="inicio"?`<div class="top"><div class="ico">🐄</div><div><b>Ganado – Porfidio Mateus</b><div class="k">Ganado de Luis Barrantes</div></div>${chipS()}</div>`
  :`<div class="top"><button class="back" onclick="go('inicio')">←</button><div><b>${m[2]}</b><div class="k">Ganado – Porfidio Mateus</div></div>${chipS()}</div>`;
 $("#app").innerHTML=({inicio:rIni,comps:rCom,resumen:rRes,animales:rAni,valor:rVal,ventas:rVen,pagos:rPag})[tab]();fill();
}
function rIni(){
 const act=D.animales.filter(a=>!vendido(a.id)).length,pen=libre()-pagTot();
 return `<div class="eb">● Nuestro ganado</div><div class="big">Cuentas claras</div><div class="k" style="font-size:15px">Ganado en aumento: ganancias 50% / 50% entre don Luis y don Porfidio.</div>
 <div class="stats"><div class="st"><div class="k">Animales activos</div><b>${act}</b><div class="k">En el hato</div></div>
 <div class="st"><div class="k">Pendiente a don Luis</div><b class="${pen>0?"neg":"pos"}">${fm(Math.max(pen,0))}</b><div class="k">${pen>0?"Por pagar":"Saldado"}</div></div>
 <div class="st"><div class="k">Disponible para nueva compra</div><b class="pos">${fm(disp())}</b><div class="k">Otra ternera</div></div></div>
 <div class="eb">Administración</div><div class="big" style="font-size:24px">Gestión del ganado</div><div class="k">Consulta y actualiza la información.</div>
 <div class="menu">${MENU.map(([k,i,t,s])=>`<button class="mi" onclick="go('${k}')"><span class="ico">${i}</span><span><b>${t}</b><span class="k">${s}</span></span></button>`).join("")}</div>
 <div class="k" style="text-align:center;margin-top:24px">Hecho para cuidar lo que compartimos</div>`;
}
function rCom(){
 return `<div class="card"><b>Don Porfidio Mateus</b><div class="k">Su parte y lo que entrega</div><button class="go" onclick="comp()">🧾 Comprobante de don Porfidio</button></div>
 <div class="card"><b>Don Luis Barrantes</b><div class="k">Lo que le corresponde y recibe</div><button class="go" onclick="compLuis()">🧾 Comprobante de don Luis</button></div>`;
}
const libre=()=>D.ventas.reduce((s,x)=>s+x.kilos*x.precio,0)-D.animales.reduce((s,a)=>s+liq(a).p,0);
function saldar(){
 const pen=libre()-pagTot();
 if(pen<=0||!confirm("¿Registrar el pago de "+fm(pen)+" de don Porfidio a don Luis ("+DL[dest]+") y dejar todo saldado?"))return false;
 D.pagos.push({id:uid(),fecha:hoy(),valor:pen,concepto:"Saldo de liquidación",dest});save();render();return true;
}
const pagTot=()=>D.pagos.reduce((s,p)=>s+p.valor,0);
function showC(S){
 if(!window.FOK){window.FONTS.then(()=>showC(S));return}
 window.CS=S;
 window.CT=[S.title.toUpperCase(),S.sub,"",...S.sections.flatMap(s=>[...(s.head?[s.head]:[]),...s.rows.map(r=>r.l+": "+r.v),""])].join("\n");
 const o=document.getElementById("cmp");if(o)o.remove();
 window.CV=paint(S);
 const d=document.createElement("div");d.id="cmp";
 d.innerHTML=`<img alt="Comprobante" src="${CV.toDataURL("image/png")}" style="width:100%;display:block;border-radius:14px;border:1px solid var(--bd);margin-bottom:12px">
 <div class="np">${S.pen>0?`<button class="go" style="margin:0 0 8px" onclick="if(saldar()){document.getElementById('cmp').remove();${S.re}}">Marcar todo pagado</button>`:""}<button class="${S.pen>0?"sec":"go"}" onclick="shareImg()">🖼️ Compartir como imagen</button><button class="sec" onclick="shareC()">Compartir texto (WhatsApp)</button><button class="sec" onclick="window.print()">Imprimir / guardar PDF</button><button class="sec" onclick="document.getElementById('cmp').remove()">Cerrar</button></div>`;
 document.body.appendChild(d);d.scrollTop=0;

 const wr=(t,f,mw)=>{x.font=f;const L=[];let c="";for(const w of String(t).split(" ")){const n=c?c+" "+w:w;if(x.measureText(n).width>mw&&c){L.push(c);c=w}else c=n}L.push(c);return L};

 const INK="#0f172a",TX2="#1e293b",MU="#64748b",LN="#e8edf3",RED="#b91c1c";

}

function delP(id){D.pagos=D.pagos.filter(p=>p.id!=id);save();render()}

 const o={animal:$("#an").value,fecha:$("#f").value||hoy(),kilos:k,precio:p,comprador:$("#c").value};if(ed)Object.assign(D.ventas.find(x=>x.id==ed),o);else D.ventas.push({id:uid(),...o});ed=null;save();render()}
